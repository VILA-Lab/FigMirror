<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 680" role="img" aria-labelledby="title desc">
  <title id="title">PlotTwin-Bench main results</title>
  <desc id="desc">Code, vision, and combined scores for FigMirror and four baselines on hand-curated and augmented references.</desc>
  <rect width="1680" height="680" rx="24" fill="#ffffff"/>
  <g font-family="Inter, Arial, sans-serif" fill="#172033">
    <text x="40" y="54" font-size="30" font-weight="700">PlotTwin-Bench main results</text>
    <text x="40" y="88" font-size="18" fill="#596579">Reference-conditioned scientific-figure style transfer · all methods use GPT-5.5</text>

    <rect x="40" y="116" width="1600" height="94" rx="14" fill="#f2f5f8"/>
    <line x1="340" y1="116" x2="340" y2="602" stroke="#d4dbe4" stroke-width="2"/>
    <line x1="990" y1="116" x2="990" y2="602" stroke="#d4dbe4" stroke-width="2"/>

    <text x="60" y="172" font-size="22" font-weight="700">Method</text>
    <text x="665" y="148" text-anchor="middle" font-size="22" font-weight="700">Hand-curated</text>
    <text x="1315" y="148" text-anchor="middle" font-size="22" font-weight="700">Augmented</text>

    <g font-size="18" font-weight="600" fill="#526075" text-anchor="middle">
      <text x="450" y="190">Code</text>
      <text x="665" y="190">Vision</text>
      <text x="880" y="190">Combined S</text>
      <text x="1100" y="190">Code</text>
      <text x="1315" y="190">Vision</text>
      <text x="1530" y="190">Combined S</text>
    </g>

    <rect x="40" y="222" width="1600" height="72" rx="12" fill="#e9f8f3" stroke="#85cbb5" stroke-width="2"/>
    <rect x="40" y="294" width="1600" height="72" fill="#ffffff"/>
    <rect x="40" y="366" width="1600" height="72" fill="#f8fafc"/>
    <rect x="40" y="438" width="1600" height="72" fill="#ffffff"/>
    <rect x="40" y="510" width="1600" height="72" rx="12" fill="#f8fafc"/>

    <g font-size="21">
      <text x="60" y="267" font-weight="750" fill="#116149">FigMirror</text>
      <text x="60" y="339">ChartIR</text>
      <text x="60" y="411">ChartGalaxy</text>
      <text x="60" y="483">Plot2Code</text>
      <text x="60" y="555">METAL</text>
    </g>

    <g font-size="21" text-anchor="middle">
      <g font-weight="750" fill="#116149">
        <text x="450" y="267">64.4</text>
        <text x="665" y="267">77.2</text>
        <text x="880" y="267">72.7</text>
        <text x="1100" y="267">84.0</text>
        <text x="1315" y="267">72.3</text>
        <text x="1530" y="267">76.4</text>
      </g>
      <g>
        <text x="450" y="339">56.6</text>
        <text x="665" y="339">63.9</text>
        <text x="880" y="339">61.3</text>
        <text x="1100" y="339">83.6</text>
        <text x="1315" y="339">63.1</text>
        <text x="1530" y="339">70.3</text>

        <text x="450" y="411">58.6</text>
        <text x="665" y="411">58.4</text>
        <text x="880" y="411">58.5</text>
        <text x="1100" y="411">80.7</text>
        <text x="1315" y="411">58.1</text>
        <text x="1530" y="411">66.0</text>

        <text x="450" y="483">53.4</text>
        <text x="665" y="483">56.8</text>
        <text x="880" y="483">55.6</text>
        <text x="1100" y="483">64.9</text>
        <text x="1315" y="483">43.0</text>
        <text x="1530" y="483">50.7</text>

        <text x="450" y="555">53.7</text>
        <text x="665" y="555">50.5</text>
        <text x="880" y="555">51.6</text>
        <text x="1100" y="555">66.2</text>
        <text x="1315" y="555">43.5</text>
        <text x="1530" y="555">51.5</text>
      </g>
    </g>

    <line x1="40" y1="602" x2="1640" y2="602" stroke="#d4dbe4" stroke-width="2"/>
    <text x="40" y="638" font-size="17" fill="#596579">Reported 150-instance subset of the 400-reference benchmark: 50 hand-curated + 100 sampled augmented references.</text>
    <text x="40" y="663" font-size="17" fill="#596579">Combined S = 0.35 × code score + 0.65 × vision score.</text>
